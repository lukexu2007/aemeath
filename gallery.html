<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小爱的壁纸 · 星海留声</title>
<style>
:root{--base:#0b0714;--line:rgba(255,255,255,.14);--panel:rgba(255,255,255,.06);
  --txt:#f4f0ff;--sub:#b6a8e0;--accent:#c9a7ff;--accent2:#7ea6ff;--w:1240px;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:var(--txt);
  background:var(--base);min-height:100vh;padding:26px 24px 60px;}
.layer-blur{position:fixed;inset:-60px;z-index:-3;
  background-image:url("bg.jpg"),url("xiaoai1.jpg"),url("xiaoai1.png"),url("xiaoai.jpg");
  background-position:center;background-size:cover;background-repeat:no-repeat;
  filter:blur(26px) saturate(1.2) brightness(.36);}
.layer-tint{position:fixed;inset:0;z-index:-1;
  background:radial-gradient(120% 90% at 14% 4%,rgba(140,90,220,.28),transparent 60%),
             linear-gradient(180deg,rgba(11,7,20,.52),rgba(11,7,20,.92));}

.page{max-width:var(--w);margin:0 auto;}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
  padding-bottom:16px;margin-bottom:34px;border-bottom:1px solid var(--line);}
.head h1{font-size:26px;letter-spacing:4px;font-weight:700;
  background:linear-gradient(120deg,#fff,var(--accent));
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.head .tip{font-size:12px;color:var(--sub);letter-spacing:1px;margin-top:7px;}
.back{font-size:13px;color:var(--txt);text-decoration:none;padding:9px 22px;
  border-radius:999px;border:1px solid var(--line);background:var(--panel);transition:.25s;}
.back:hover{background:rgba(255,255,255,.13);}

/* 瀑布流：每张图保持原始比例，不裁切 */
.grid{column-count:3;column-gap:18px;}
.grid figure{break-inside:avoid;margin:0 0 18px;
  background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:10px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  transition:transform .3s,border-color .3s;}
.grid figure:hover{transform:translateY(-4px);border-color:rgba(201,167,255,.5);}
.grid a{display:block;overflow:hidden;border-radius:12px;}
.grid img{width:100%;display:block;transition:transform .5s;}
.grid figure:hover img{transform:scale(1.04);}
.grid figcaption{display:flex;justify-content:space-between;
  padding:11px 4px 2px;font-size:12px;color:var(--sub);letter-spacing:1px;}

@media (max-width:900px){
  .grid{column-count:2;column-gap:12px;}
  .grid figure{margin-bottom:12px;padding:8px;}
}
@media (max-width:560px){.grid{column-count:1;}}
</style>
</head>
<body>
<div class="layer-blur"></div>
<div class="layer-tint"></div>

<div class="page">
  <header class="head">
    <div>
      <h1>小爱的壁纸</h1>
      <p class="tip">点图片可以看原图</p>
    </div>
    <a class="back" href="index.html">← 返回主页</a>
  </header>

  <div class="grid">
    <figure><a href="xiaoai1.png" target="_blank"><img src="xiaoai1.png" alt="小爱壁纸 1"></a>
      <figcaption><span>星海留声 · 01</span><span>01</span></figcaption></figure>

    <figure><a href="xiaoai2.jpg" target="_blank"><img src="xiaoai2.jpg" alt="小爱壁纸 2"></a>
      <figcaption><span>星海留声 · 02</span><span>02</span></figcaption></figure>

    <figure><a href="xiaoai3.jpg" target="_blank"><img src="xiaoai3.jpg" alt="小爱壁纸 3"></a>
      <figcaption><span>星海留声 · 03</span><span>03</span></figcaption></figure>

    <figure><a href="xiaoai4.jpg" target="_blank"><img src="xiaoai4.jpg" alt="小爱壁纸 4"></a>
      <figcaption><span>星海留声 · 04</span><span>04</span></figcaption></figure>

    <figure><a href="xiaoai5.jpg" target="_blank"><img src="xiaoai5.jpg" alt="小爱壁纸 5"></a>
      <figcaption><span>星海留声 · 05</span><span>05</span></figcaption></figure>

    <!-- 以后加新图：复制上面任意一个 <figure> 整块，改掉文件名和编号即可 -->
  </div>
</div>
</body>
</html>
