<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>爱弥斯 · 星海留声</title>
<style>
:root{
  --base:#0b0714;  --line:rgba(255,255,255,.14);  --panel:rgba(255,255,255,.06);
  --txt:#f4f0ff;   --sub:#b6a8e0;
  --accent:#c9a7ff; --accent2:#7ea6ff;  --w:1240px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;
  color:var(--txt); background:var(--base); min-height:100vh;
  padding:26px 24px 52px; overflow-x:hidden;
}

/* ========== 三层底图 ========== */
.layer-blur{position:fixed;inset:-60px;z-index:-3;
  background-image:url("bg.jpg"),url("xiaoai1.jpg"),url("xiaoai1.png"),url("xiaoai.jpg");
  background-position:58% center,58% center,58% center,58% center;
  background-size:cover,cover,cover,cover;
  background-repeat:no-repeat,no-repeat,no-repeat,no-repeat;
  filter:blur(22px) saturate(1.25) brightness(.46);}
.layer-art{position:fixed;top:0;left:16%;height:100vh;width:min(52vw,760px);z-index:-2;
  background-image:url("xiaoai.jpg");
  background-position:center center;
  background-size:auto 100%;
  background-repeat:no-repeat;
  opacity:.28;
  -webkit-mask-image:linear-gradient(to right,transparent 0%,#000 20%,#000 70%,transparent 100%);
          mask-image:linear-gradient(to right,transparent 0%,#000 20%,#000 70%,transparent 100%);}
.layer-tint{position:fixed;inset:0;z-index:-1;
  background:radial-gradient(120% 90% at 16% 6%,rgba(140,90,220,.30),transparent 60%),
             linear-gradient(180deg,rgba(11,7,20,.42),rgba(11,7,20,.90));}

/* ========== 布局 ========== */
.page{max-width:var(--w);margin:0 auto;}
.head{display:flex;align-items:center;justify-content:space-between;
  padding-bottom:16px;margin-bottom:38px;border-bottom:1px solid var(--line);}
.brand{display:flex;align-items:center;gap:11px;font-size:14px;letter-spacing:1px;}
.brand img{width:32px;height:32px;border-radius:50%;object-fit:cover;border:1px solid var(--line);}
.head .en{font-size:11px;letter-spacing:3px;color:var(--sub);}

.main{display:grid;grid-template-columns:1.2fr .8fr;gap:32px;align-items:center;}

.tag{display:inline-block;font-size:12px;letter-spacing:2px;color:var(--accent);
  border:1px solid rgba(201,167,255,.4);border-radius:999px;padding:5px 15px;
  background:rgba(201,167,255,.08);}
h1{font-size:82px;line-height:1.05;margin:22px 0 14px;letter-spacing:8px;
  background:linear-gradient(120deg,#fff 8%,var(--accent) 48%,var(--accent2) 88%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 40px rgba(150,110,255,.25);}
.sub{font-size:14px;letter-spacing:4px;color:var(--sub);margin-bottom:28px;}
.quote{font-size:23px;line-height:2;color:#e6dffc;max-width:26em;
  border-left:2px solid rgba(201,167,255,.55);padding-left:18px;}

/* ---- 壁纸按钮 ---- */
.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:36px;}
.enter{display:inline-flex;align-items:center;gap:10px;
  padding:15px 32px;border-radius:999px;font-size:15px;font-weight:700;
  color:#1a1030;text-decoration:none;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 10px 30px rgba(150,110,255,.38);
  transition:transform .25s,box-shadow .25s;}
.enter:hover{transform:translateY(-3px);box-shadow:0 16px 38px rgba(150,110,255,.55);}
.enter i{font-style:normal;transition:transform .25s;}
.enter:hover i{transform:translateX(4px);}

/* ---- 音乐播放条 ---- */
.player{display:inline-flex;align-items:center;gap:14px;margin-top:14px;
  padding:7px 12px 7px 7px;border-radius:999px;
  background:var(--panel);border:1px solid var(--line);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);}
.pbtn{display:inline-flex;align-items:center;gap:8px;
  padding:10px 20px;border-radius:999px;border:0;cursor:pointer;
  font-family:inherit;font-size:14px;font-weight:700;color:#1a1030;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  transition:transform .2s,box-shadow .2s;white-space:nowrap;}
.pbtn:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(150,110,255,.45);}
.ptitle{font-size:14px;color:var(--txt);letter-spacing:1px;white-space:nowrap;}
.ptitle small{color:var(--sub);font-size:12px;margin-left:7px;}
.parrow{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);
  background:transparent;color:var(--sub);cursor:pointer;font-size:15px;
  font-family:inherit;line-height:1;transition:.2s;flex:none;}
.parrow:hover{color:var(--txt);background:rgba(255,255,255,.12);}

/* ---- 右边图片 ---- */
.art{max-width:460px;margin-left:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:20px;
  padding:12px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);}
.art img{width:100%;display:block;border-radius:13px;}
.art .note{padding:14px 6px 4px;font-size:13.5px;line-height:1.95;color:#cfc6ea;}

@media (max-width:900px){
  h1{font-size:54px;letter-spacing:4px;}
  .main{grid-template-columns:1fr;gap:26px;}
  .head .en{display:none;}
  .quote{font-size:17px;}
  .art{max-width:100%;margin:0;}
  .btns{margin-top:28px;}
  .enter{padding:13px 26px;font-size:14px;}
  .player{width:100%;justify-content:space-between;gap:10px;padding:6px 10px 6px 6px;}
  .ptitle{font-size:13px;}
}
</style>
</head>
<body>
<div class="layer-blur"></div>
<div class="layer-art"></div>
<div class="layer-tint"></div>

<div class="page">
  <header class="head">
    <div class="brand"><img src="xiaoai.jpg" alt="头像"><span>星海留声 · 爱弥斯</span></div>
    <div class="en">STAR MEMORY</div>
  </header>

  <main class="main">
    <section>
      <span class="tag">星海留声 · 不可见星辉</span>
      <h1>爱弥斯</h1>
      <p class="sub">A E M E A T H</p>
      <p class="quote">小爱祝你天天开心！</p>

      <div class="btns">
        <a class="enter" href="gallery.html">还想要小爱壁纸的话点这里！<i>→</i></a>
      </div>

      <div class="player">
        <button class="pbtn" id="bgmBtn" type="button"><span id="bgmIcon">♪</span>音乐</button>
        <span class="ptitle" id="bgmTitle">纸飞机<small>1/3</small></span>
        <button class="parrow" id="bgmPrev" type="button" title="上一首">‹</button>
        <button class="parrow" id="bgmNext" type="button" title="下一首">›</button>
      </div>
    </section>

    <aside class="art">
      <img src="xiaoai.jpg" alt="爱弥斯">
      <p class="note">如果你还能看见我，那我就不算真正走失。至少这一次，星海彼端终于有人回应。</p>
    </aside>
  </main>
</div>

<!-- ===== 背景音乐播放器 ===== -->
<audio id="bgm" preload="none"></audio>

<script>
(function(){
  /* 歌单：文件名 + 显示的歌名，加歌就往这里加一行 */
  var list = [
    { file:'music1.mp3', name:'纸飞机'      },
    { file:'music2.mp3', name:'星炬不熄'    },
    { file:'music3.mp3', name:'远航星的告别' }
  ];
  var idx = 0;            /* 默认从第 1 首开始 */
  var playing = false;

  var btn   = document.getElementById('bgmBtn');
  var bgm   = document.getElementById('bgm');
  var icon  = document.getElementById('bgmIcon');
  var title = document.getElementById('bgmTitle');
  if (!btn || !bgm) return;

  bgm.setAttribute('src', list[0].file);

  function render(){
    icon.textContent = playing ? '❚❚' : '♪';
    title.innerHTML = list[idx].name + '<small>' + (idx+1) + '/' + list.length + '</small>';
  }

  /* 切到第 i 首并播放，越界自动绕回 */
  function start(i){
    idx = (i % list.length + list.length) % list.length;
    if (bgm.getAttribute('src') !== list[idx].file) {
      bgm.setAttribute('src', list[idx].file);
    }
    bgm.play().then(function(){
      playing = true; render();
    }).catch(function(){
      playing = false; render(); title.textContent = '音频加载失败';
    });
  }

  render();

  /* 播放 / 暂停（暂停后再点从原位置继续） */
  btn.addEventListener('click', function(){
    if (playing) { bgm.pause(); playing = false; render(); }
    else { start(idx); }
  });

  /* 手动切歌 */
  document.getElementById('bgmNext').addEventListener('click', function(){ start(idx + 1); });
  document.getElementById('bgmPrev').addEventListener('click', function(){ start(idx - 1); });

  /* 一首放完自动切下一首 */
  bgm.addEventListener('ended', function(){ start(idx + 1); });
})();
</script>
</body>
</html>
